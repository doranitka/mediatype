<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Медиатип НТК</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap">
<style>
/* Градиент-модерн: стеклянные карточки на сине-бирюзовом градиенте */
:root{
  --g1:#071633; --g2:#0a4f63; --g3:#10a7a0;
  --fg:#f2fbfa; --muted:#cde9e6; --accent:#9df3ec; --ink:#0a4f63;
  --glass:rgba(255,255,255,.10); --glass2:rgba(255,255,255,.18); --glass-br:rgba(255,255,255,.24);
  --warn:#ffb3a6;
  color-scheme: dark;
}
body{background:linear-gradient(135deg,var(--g1) 0%,var(--g2) 55%,var(--g3) 135%) no-repeat,var(--g2);
  color:var(--fg);font-family:'Montserrat',system-ui,Arial,sans-serif;
  padding-inline:16px;padding-block:28px;min-height:96vh;display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:640px;display:flex;flex-direction:column;gap:22px;
  background:var(--glass);border:1.5px solid var(--glass-br);border-radius:24px;padding:30px 26px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 14px 44px rgba(4,20,40,.28)}
@media (max-width:420px){ .wrap{padding:24px 18px} }
.wrap > div{display:flex;flex-direction:column;gap:18px}
h1,h2{margin-bottom:2px}
.bar{margin-bottom:6px}
.kick{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:4px;text-transform:uppercase}
h1{font-size:30px;font-weight:800;line-height:1.2;margin:0;text-wrap:balance}
h2{font-size:21px;font-weight:700;line-height:1.3;margin:0;text-wrap:balance}
p{line-height:1.55;margin:0;color:var(--muted);font-size:15px}
.note{font-size:13.5px}
.bar{height:5px;background:rgba(255,255,255,.16);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0%;transition:width .25s;border-radius:3px}
.step{color:var(--muted);font-size:12.5px;font-weight:600;letter-spacing:1px;opacity:.85}
.opts{display:flex;flex-direction:column;gap:10px}
button.opt{appearance:none;text-align:left;background:var(--glass);color:var(--fg);
  border:1.5px solid var(--glass-br);border-radius:16px;padding:14px 16px;font:inherit;font-size:15px;
  line-height:1.4;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:border-color .12s, background .12s, transform .08s}
button.opt:hover{border-color:var(--accent)}
button.opt:active{transform:scale(.99)}
button.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--glass2)}
button.opt[aria-pressed="true"]::before{content:"\2713\00a0\00a0";color:var(--accent);font-weight:800}
button.opt:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{appearance:none;border:none;border-radius:999px;padding:15px 26px;font:inherit;font-weight:700;
  font-size:15.5px;cursor:pointer;background:#ffffff;color:var(--ink);box-shadow:0 6px 22px rgba(4,20,40,.25)}
.btn:hover{box-shadow:0 8px 26px rgba(4,20,40,.35)}
.btn[disabled]{opacity:.35;cursor:default}
.btn.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--glass-br);box-shadow:none}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
label{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:6px}
input[type=text],textarea{width:100%;box-sizing:border-box;background:var(--glass);color:var(--fg);
  border:1.5px solid var(--glass-br);border-radius:14px;padding:12px 14px;font:inherit;font-size:15px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
input::placeholder,textarea::placeholder{color:rgba(242,251,250,.45)}
textarea{min-height:72px;resize:vertical}
.fields{display:flex;flex-direction:column;gap:14px}
.card{background:var(--glass);border:1.5px solid var(--glass-br);border-radius:20px;padding:24px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 36px rgba(4,20,40,.22)}
.card.result{padding:0 0 4px;overflow:hidden}
.card.result > .kick{margin:20px 24px 0}
.card.result > .type{margin:6px 24px 2px}
.card.result > .badges{margin:10px 24px 0}
.card.result > p{margin:12px 24px 24px !important}
.typeimg{width:min(100%,340px);height:auto;display:block;margin:24px auto 0;border-radius:18px;
  border:1.5px solid var(--glass-br);box-shadow:0 10px 30px rgba(4,20,40,.3)}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{background:rgba(157,243,236,.12);border:1.5px solid var(--accent);color:var(--accent);
  border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700}
.type{font-size:38px;font-weight:800;color:#ffffff;line-height:1.1;margin:4px 0 2px;
  text-shadow:0 2px 18px rgba(157,243,236,.35)}
.hint{color:var(--warn);font-size:13px;min-height:18px;font-weight:600}
.sendcard{display:flex;flex-direction:column;gap:12px}
.sendtitle{color:var(--fg);font-weight:700;font-size:17px}
a.sendbtn{display:block;text-align:center;text-decoration:none;margin-top:4px}
.ok{color:var(--accent);font-weight:700;font-size:14.5px}
.foot{color:rgba(242,251,250,.4);font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-top:10px}
.multi-note{font-size:12.5px;color:var(--muted);font-style:italic;opacity:.9}
@media (max-width:420px){ h1{font-size:25px} .type{font-size:30px} }
</style>

const TYPES = {
  hero:  {name:"Герой",  desc:"Вы готовы к кадру — таких людей в любой компании единицы. Вам подойдут видеоформаты: интервью, экспертные комментарии на камеру, участие в сюжетах с производственных площадок."},
  voice: {name:"Голос",  desc:"Ваш формат — звук и живой рассказ: подкаст, закадровый текст, истории из практики. Вся выразительность без камеры. Именно таких участников мы ищем дольше всего."},
  expert:{name:"Эксперт",desc:"Ваше оружие — точная формулировка. Вам подойдут письменные комментарии, разборы и колонки: вы объясняете своё дело, мы упаковываем в материал."},
  scout: {name:"Продюсер",desc:"Вы знаете, у кого в компании есть истории и кто умеет рассказывать. Будем изредка советоваться — такое участие не менее ценно, чем появление в кадре."},
  viewer:{name:"Зритель",desc:"Честный ответ — уже вклад. Читайте наш канал и слушайте подкаст, а если однажды передумаете — этот тест никуда не денется."},
};

function el(html){ const d=document.createElement("div"); d.innerHTML=html; return d; }
function app(){ return document.getElementById("app"); }
function progress(){ return Math.round(((S.i+1)/(Q.length+1))*100); }

function render(){
  const a = app(); a.innerHTML = "";
  if (S.i === -1) return renderIntro(a);
  if (S.i >= Q.length) return renderResult(a);
  renderQuestion(a, Q[S.i]);
}

function renderIntro(a){
  a.appendChild(el(`
    <div class="kick">Медиакоманда НТК</div>
    <h1>Какой вы медиатип?</h1>
    <p>Три минуты: короткое знакомство и семь рабочих ситуаций. В конце — ваш медиатип: формат участия в материалах компании, который подойдёт именно вам.</p>
    <div><button class="btn" id="start">Начать</button></div>
    <div class="foot">Транспортная логистика НТК</div>`));
  a.querySelector("#start").onclick = () => { S.i = 0; render(); };
}

function stepLabel(q){
  if (q.sit) return "Ситуация " + q.sit + " из 7";
  const base = Q.filter(z => !z.sit);
  return "Вопрос " + (base.indexOf(q)+1) + " из " + base.length;
}

function renderQuestion(a, q){
  a.appendChild(el(`
    <div class="step">${stepLabel(q)}</div>
    <div class="bar"><i style="width:${progress()}%"></i></div>
    ${q.note ? `<p class="note">${q.note}</p>` : ""}
    <h2>${q.title}</h2>
    ${q.noteMulti ? `<p class="multi-note">${q.noteMulti}</p>` : ""}
    <div id="body"></div>
    <p class="hint" id="hint"></p>
    <div class="nav">
      <button class="btn ghost" id="back">Назад</button>
      <button class="btn" id="next">Дальше</button>
    </div>`));
  const body = a.querySelector("#body"), hint = a.querySelector("#hint");
  const next = a.querySelector("#next"), back = a.querySelector("#back");

  if (q.kind === "fields"){
    const f = el(`<div class="fields">${q.fields.map(x=>`
      <div><label for="f_${x.k}">${x.label}</label>${x.area
        ? `<textarea id="f_${x.k}" placeholder="${x.ph}"></textarea>`
        : `<input type="text" id="f_${x.k}" placeholder="${x.ph}">`}</div>`).join("")}</div>`);
    body.appendChild(f);
    const st = S.a[q.id] || {};
    q.fields.forEach(x => { const inp=f.querySelector("#f_"+x.k); inp.value = st[x.k]||""; });
    next.onclick = () => {
      const val = {};
      q.fields.forEach(x => val[x.k] = f.querySelector("#f_"+x.k).value.trim());
      if (!q.optional && q.fields.some(x => x.label.includes("*") && !val[x.k])) {
        hint.textContent = "Заполните, пожалуйста, обязательные поля."; return;
      }
      S.a[q.id] = val; S.i++; render();
    };
  } else {
    const multi = q.kind === "multi";
    const sel = new Set(S.a[q.id] || []);
    const box = el(`<div class="opts">${q.opts.map((o,i)=>
      `<button class="opt" type="button" data-i="${i}" aria-pressed="${sel.has(i)}">${o}</button>`).join("")}</div>`);
    body.appendChild(box);
    box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const i = +b.dataset.i;
      if (!multi){ sel.clear(); sel.add(i); }
      else {
        const isExcl = (q.excl||[]).includes(i);
        if (sel.has(i)) sel.delete(i);
        else {
          if (isExcl) sel.clear();
          else (q.excl||[]).forEach(e => sel.delete(e));
          if (q.max && sel.size >= q.max) return hint.textContent = "Не больше " + q.max + " вариантов.";
          sel.add(i);
        }
      }
      hint.textContent = "";
      box.querySelectorAll(".opt").forEach(x => x.setAttribute("aria-pressed", sel.has(+x.dataset.i)));
      if (!multi){ S.a[q.id] = [...sel]; setTimeout(()=>{ S.i++; render(); }, 180); }
    });
    next.onclick = () => {
      if (!sel.size) { hint.textContent = "Выберите вариант, чтобы продолжить."; return; }
      S.a[q.id] = [...sel]; S.i++; render();
    };
  }
  back.onclick = () => { S.i--; render(); };
  if (S.i === 0) back.hidden = true;
}

function computeType(){
  const score = { hero:0, voice:0, expert:0, scout:0, viewer:0 };
  SIT_IDS.forEach(id => {
    const q = Q.find(z => z.id === id);
    const i = (S.a[id]||[])[0];
    if (i != null && q.map[i]) score[q.map[i]]++;
  });
  const max = Math.max(...ORDER.map(k => score[k]));
  const top = ORDER.filter(k => score[k] === max);
  let key = top[0];
  if (top.length > 1){
    const q7 = Q.find(z => z.id === "s7");
    const t7 = q7.map[(S.a.s7||[])[0]];
    if (top.includes(t7)) key = t7;
  }
  const badges = [];
  const exp = S.a.exp||[];
  if (exp.includes(1)) badges.push("Уже в эфире — есть опыт интервью");
  else if (exp.includes(0)) badges.push("Опытный спикер");
  if (exp.includes(2)) badges.push("Автор — вы уже создаёте контент");
  return { key, badges, score };
}

function answersText(rec){
  const t = computeType();
  const c = S.a.contact||{};
  const pick = (qid, idx) => (idx||[]).map(i => Q.find(z=>z.id===qid).opts[i]).join("; ");
  const sits = SIT_IDS.map((id, n) => {
    const q = Q.find(z => z.id === id);
    const i = (S.a[id]||[])[0];
    return (n+1) + " " + (i != null ? TYPES[q.map[i]].name : "—");
  }).join("; ");
  const scoreLine = ORDER.map(k => TYPES[k].name + " " + t.score[k]).join(" · ");
  return [
    "АНКЕТА «МЕДИАТИП НТК»",
    "Имя: " + (c.name||"—"),
    "Подразделение: " + (c.dept||"—"),
    "Контакт: " + (c.tg||"—"),
    "Опыт: " + (pick("exp", S.a.exp)||"—"),
    "Частота: " + pick("freq", S.a.freq),
    "Что останавливает: " + (pick("stop", S.a.stop)||"—"),
    "Ситуации: " + sits,
    "Баллы: " + scoreLine,
    "МЕДИАТИП: " + TYPES[t.key].name + (t.badges.length ? " · " + t.badges.join(" · ") : ""),
    "Рекомендует коллегу: " + (rec||"—"),
  ].join("\n");
}

function renderResult(a){
  const t = computeType(), T = TYPES[t.key];
  a.appendChild(el(`
    <div class="step">Готово</div>
    <div class="bar"><i style="width:100%"></i></div>
    <div class="card result">
      <img class="typeimg" src="${IMG[t.key]}" alt="${T.name}">
      <div class="kick">Ваш медиатип</div>
      <div class="type">${T.name}</div>
      ${t.badges.length ? `<div class="badges">${t.badges.map(b=>`<span class="badge">${b}</span>`).join("")}</div>` : ""}
      <p style="margin-top:12px">${T.desc}</p>
    </div>
    <div class="card sendcard">
      <p class="sendtitle">Остался один шаг</p>
      <div><label for="rec">Кого из коллег нам точно стоит позвать? (необязательно)</label>
        <input type="text" id="rec" placeholder="Имя, подразделение"></div>
      <p class="note">Нажмите кнопку — откроется форма, где ваш ответ уже заполнен. Останется нажать в ней «Отправить».</p>
      <a class="btn sendbtn" id="send" href="#" target="_blank" rel="noopener">Отправить ответ</a>
    </div>
    <p class="note">Спасибо! Если появится подходящая тема, мы напишем вам и предложим — решение всегда за вами, и любой материал вы увидите до публикации.</p>
    <div class="foot">Транспортная логистика НТК</div>`));
  const send = a.querySelector("#send"), rec = a.querySelector("#rec");
  const upd = () => send.href = FORM_URL + "?" + FORM_FIELD + "=" + encodeURIComponent(answersText(rec.value.trim()));
  rec.oninput = upd;
  upd();
}
render();
</script>

</html>
